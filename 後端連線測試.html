<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>測試跨網綠 axios 連線</title>

    <!-- 測試網址: http://localhost:5500/%E5%BE%8C%E7%AB%AF%E9%80%A3%E7%B7%9A%E6%B8%AC%E8%A9%A6.html -->
  </head>
  <body>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.11.0/axios.min.js"
      integrity="sha512-h9644v03pHqrIHThkvXhB2PJ8zf5E9IyVnrSfZg8Yj8k4RsO4zldcQc4Bi9iVLUCCsqNY0b4WXVV4UB+wbWENA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script>
      const apiUrl = 'https://igotbrew-render-back.onrender.com/product'

      console.log(document.cookie)

      // 向後端發送請求檢查是否登入
      axios
        .get(apiUrl, {
          withCredentials: true, // 攜帶 cookie（accessToken）
        })
        .then((res) => {
          if (res.data.status === 'success') {
            console.log('✅ 使用者已登入')
            console.log(res.data.data.user) // 顯示用戶資料
          } else {
            console.log('❌ 使用者不存在或尚未登入')
            console.log(res.data.message)
          }
        })
        .catch((error) => {
          console.log('🚨 請求錯誤')
          console.error(error)
        })
    </script>
  </body>
</html>
